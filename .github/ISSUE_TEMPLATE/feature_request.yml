name: Feature request
description: An idea for something klaussy should do
labels: ["enhancement"]
body:
  - type: dropdown
    id: product
    attributes:
      label: Which product?
      options:
        - Klaussy Desktop
        - klaussy review (GitHub App or Action)
        - klaussy CLI (klaussy-agents)
        - klaussy.com
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Start from the workflow, not the feature. "I need to X" helps more than "add a button for X".
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How you'd like it to work (optional)
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead (optional)
