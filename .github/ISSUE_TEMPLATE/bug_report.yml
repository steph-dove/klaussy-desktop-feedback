name: Bug report
description: Something broke or didn't work the way it should
labels: ["bug"]
body:
  - type: dropdown
    id: product
    attributes:
      label: Which product?
      options:
        - Klaussy Desktop
        - klaussy review (GitHub App)
        - klaussy review (GitHub Action)
        - klaussy CLI (klaussy-agents)
        - klaussy.com
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: A few sentences is plenty. For a review, a link to the pull request helps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
  - type: input
    id: version
    attributes:
      label: Version and OS
      description: For Desktop, Help → About; for the CLI, `klaussy --version`. Skip for the hosted App.
      placeholder: "Klaussy 0.24.2, macOS 15.1 (Apple Silicon)"
  - type: textarea
    id: logs
    attributes:
      label: Logs or error messages
      description: For Desktop, Cmd+K → View Logs. Remove anything private, like API keys or code you can't share.
      render: shell
